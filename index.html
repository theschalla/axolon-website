<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axolon Biosciences</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #0b1d31;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .hero {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1536px;
      object-fit: contain;
    }

    @media (min-aspect-ratio: 3/2) {
      .hero {
        width: auto;
        height: 100vh;
        max-width: none;
        max-height: 1024px;
      }
    }
  </style>
</head>
<body>
  <img class="hero" src="hero.png" alt="Axolon Biosciences — Convergent therapeutics.">
</body>
</html>
